####################################################
#                                                  #
#                   ORP Piscine                    #
#                   Metriques                      #
# ORP stands for oxidation-reduction potential, which is
# a measure, in millivolts, of the tendency of a chemical
# substance to oxidize or reduce another chemical substance.
####################################################


sensor:
  # Statistiques orp
  - platform: statistics
    name: orp_stat_median
    # entity_id: sensor.orp_piscine_orp
    entity_id: sensor.mouillezalin_chlore
    state_characteristic: median
    sampling_size: 30
    #max_age:
      # minutes: 30

  - platform: statistics
    name: orp_stat_moyenne
    # entity_id: sensor.orp_piscine_orp
    entity_id: sensor.mouillezalin_chlore
    state_characteristic: average_step
    sampling_size: 30
    #max_age:
      # minutes: 30

  - platform: statistics
    name: orp_stat_standard_deviation
    # entity_id: sensor.orp_piscine_orp
    entity_id: sensor.mouillezalin_chlore
    state_characteristic: standard_deviation
    sampling_size: 30
    #max_age:
      # minutes: 30

  - platform: statistics
    name: 'Daily Cl Min'
    unique_id: 85909078-6f2c-4fe2-b62e-27b885e0e383
    entity_id: sensor.piscine_182_mouillezalin_chlorine
    state_characteristic: value_min
    max_age:
      hours: 24
  - platform: statistics
    name: 'Daily Cl Max'
    unique_id: 96b10d3a-2f24-4196-abb8-3b458b212191
    entity_id: sensor.piscine_182_mouillezalin_chlorine
    state_characteristic: value_max
    max_age:
      hours: 24